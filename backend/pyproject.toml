[project]
name = "math-to-go"
version = "0.1.0"
description = "Agentic RAG + Knowledge Graph math tutoring system for Chinese elementary students"
requires-python = ">=3.12,<3.14"

dependencies = [
    # ── API server ───────────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",   # file uploads (UC-3 image)

    # ── LLM ──────────────────────────────────────────────────────────────────
    "anthropic>=0.49",

    # ── Agent orchestration ───────────────────────────────────────────────────
    "langgraph>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-community>=0.3",

    # ── Vector stores ─────────────────────────────────────────────────────────
    "langchain-chroma>=0.2",
    "chromadb>=0.6",
    "qdrant-client>=1.13",

    # ── Knowledge graph ───────────────────────────────────────────────────────
    "langchain-neo4j>=0.4",
    "neo4j>=5.28",

    # ── Embedding + reranker (BGE-M3 / bge-reranker-v2-m3) ───────────────────
    "FlagEmbedding>=1.3",

    # ── UC-4 cross-session checkpointer ──────────────────────────────────────
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",

    # ── KB management ─────────────────────────────────────────────────────────
    "python-frontmatter>=1.1",

    # ── Config + env ──────────────────────────────────────────────────────────
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",

    # ── Logging ───────────────────────────────────────────────────────────────
    "loguru>=0.7",

    # ── Chinese NLP ───────────────────────────────────────────────────────────
    "jieba>=0.42",

    # ── UC-2 symbolic verifier ────────────────────────────────────────────────
    "sympy>=1.13",

    # ── UC-3 image handling ───────────────────────────────────────────────────
    "Pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "pytest-benchmark>=5.0",
    "httpx>=0.28",          # AsyncClient for FastAPI route tests
    "mypy>=1.14",
    "ruff>=0.9",
    "types-Pillow>=10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true   # FlagEmbedding has no stubs
exclude = ["tests/"]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
