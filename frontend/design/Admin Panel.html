// ─── AgentPipeline (inline, no dep on components.jsx) ────────────────────────
function AgentPipeline({ steps, currentStep }) {
  return (
    <div style={{ position:"relative", display:"flex", alignItems:"flex-start",
      justifyContent:"space-between", padding:"20px 16px 16px",
      background:"#F8F5F0", borderRadius:12, border:"1.5px solid #EDE8DF" }}>
      {/* track */}
      <div style={{ position:"absolute", top:36, left:"calc(16px + 12px)",
        right:"calc(16px + 12px)", height:2, background:"#DDD8CE", borderRadius:1, zIndex:0 }}>
        <div style={{ height:"100%", background:"#1865F2", borderRadius:1,
          transition:"width .5s ease",
          width: currentStep >= steps.length ? "100%" : `${(currentStep / Math.max(steps.length-1,1))*100}%`,
        }} />
      </div>
      {steps.map((step, i) => {
        const state = i < currentStep ? "done" : i === currentStep ? "running" : "pending";
        return (
          <div key={i} style={{ display:"flex", flexDirection:"column", alignItems:"center",
            gap:6, flex:1, position:"relative", zIndex:1, minWidth:0 }}>
            <div style={{ position:"relative", display:"flex", alignItems:"center", justifyContent:"center", width:28, height:28 }}>
              {state === "running" && (
                <div style={{ position:"absolute", inset:-6, borderRadius:"50%",
                  border:"2px solid rgba(24,101,242,0.35)", animation:"ripple 1.4s ease-out infinite" }} />
              )}
              <div style={{ width:24, height:24, borderRadius:"50%",
                background: state === "done" ? "#1865F2" : state === "running" ? "#1865F2" : "#DDD8CE",
                display:"flex", alignItems:"center", justifyContent:"center", transition:"all .3s",
                boxShadow: state === "running" ? "0 0 0 3px rgba(24,101,242,0.25)" : "none" }}>
                {state === "done" && (
                  <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
                    <path d="M1 4l3 3 5-6" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                )}
                {state === "running" && (
                  <div style={{ width:8, height:8, borderRadius:"50%", background:"#fff", animation:"pulse 1s infinite" }} />
                )}
              </div>
            </div>
            <div style={{ fontSize:12, textAlign:"center", lineHeight:1.3, maxWidth:72,
              color: state === "pending" ? "#9E9589" : "#1A1A1A",
              fontWeight: state === "running" ? 700 : 500 }}>{step.label}</div>
            {state === "running" && (
              <div style={{ fontSize:11, color:"#1865F2", fontWeight:600, animation:"pulse 1.5s infinite" }}>运行中…</div>
            )}
            {state === "done" && step.result && (
              <div style={{ fontSize:11, color:"#16A34A", fontWeight:600, textAlign:"center", maxWidth:72 }}>{step.result}</div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── KBDocManager ──────────────────────────────────────────────────────────────
function KBDocManager() {
  const [docs, setDocs]         = React.useState(MOCK_DOCS);
  const [filter, setFilter]     = React.useState("all");
  const [search, setSearch]     = React.useState("");
  const [uploading, setUploading] = React.useState(false);
  const [selected, setSelected] = React.useState(null);
  const [showUpload, setShowUpload] = React.useState(false);
  const [newDocType, setNewDocType] = React.useState("concept");
  const [deleteConfirm, setDeleteConfirm] = React.useState(null);
  const fileRef = React.useRef();

  const typeColors = { concept:"concept", heuristic:"heuristic", exercise:"exercise", mistake:"mistake" };
  const typeIcons  = { concept:"📖", heuristic:"💡", exercise:"📝", mistake:"⚠️" };

  const filtered = docs.filter(d => {
    const matchType = filter === "all" || d.type === filter;
    const matchSearch = !search || d.title.includes(search) || d.id.includes(search) || d.subtopic.includes(search);
    return matchType && matchSearch;
  });

  function handleDelete(id) {
    setDocs(d => d.filter(doc => doc.id !== id));
    setDeleteConfirm(null);
    setSelected(null);
  }

  function handleUpload() {
    setUploading(true);
    setTimeout(() => {
      const newId = `${newDocType.toUpperCase().slice(0,2)}.G4T2.EQ.${String(docs.length+1).padStart(3,"0")}`;
      const typeMap = { concept:"CONCEPT", heuristic:"HEUR", exercise:"EX", mistake:"MISTAKE" };
      const fullId = `${typeMap[newDocType]}.G4T2.EQ.${String(docs.length+1).padStart(3,"0")}`;
      setDocs(d => [...d, {
        id:fullId, type:newDocType, title:"新上传文档（待编辑）",
        unit:"认识方程", grade:"G4", term:"T2", subtopic:"equation_definition",
        difficulty:"easy", status:"draft", version:"v0.0.3",
        size:"0.5KB", updated:"2026-05-03",
      }]);
      setUploading(false);
      setShowUpload(false);
    }, 1200);

                color: filter===t ? "#1865F2" : "#5A5248",

          <button className="btn-primary" onClick={() => setShowUpload(true)}>

            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              <label style={{ fontSize:13, fontWeight:600, color:"#5A5248" }}>文档类型</label>
              <select value={newDocType} onChange={e => setNewDocType(e.target.value)}
                style={{ height:38, borderRadius:8, border:"1.5px solid #DDD8CE",
                  padding:"0 12px", fontSize:14, fontFamily:"inherit", minWidth:160 }}>
                <option value="concept">📖 concept — 知识点</option>
                <option value="heuristic">💡 heuristic — 答题技巧</option>
                <option value="exercise">📝 exercise — 新题库</option>
                <option value="mistake">⚠️ mistake — 错题集</option>

            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>

          </div>
        </div>
      )}

      {/* Doc table + detail panel */}
      <div style={{ display:"grid", gridTemplateColumns: sel ? "1fr 360px" : "1fr", gap:12, alignItems:"start" }}>
        {/* Table */}
        <div className="card" style={{ padding:0, overflow:"hidden" }}>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead>
              <tr style={{ background:"#F8F5F0", borderBottom:"1px solid #EDE8DF" }}>

                  onClick={() => setSelected(selected===doc.id ? null : doc.id)}>
                  <td style={{ padding:"10px 14px" }}>
                    <span className={`tag tag-${doc.type}`}>{typeIcons[doc.type]} {doc.type}</span>

                  <td style={{ padding:"10px 14px", fontSize:14, fontWeight:500, maxWidth:180 }}>{doc.title}</td>
                  <td style={{ padding:"10px 14px", fontSize:12, color:"#7A7167" }}>{doc.subtopic}</td>

                      {doc.difficulty}

                  </td>
                  <td style={{ padding:"10px 14px" }}>
                    <code style={{ fontSize:12, color:"#1865F2", fontWeight:700 }}>{doc.version}</code>
                  </td>

                    <span className={`tag tag-${doc.status}`}>{doc.status}</span>

                ["size",      sel.size],

                <button className="btn-secondary" style={{ flex:1 }}>替换文件</button>

      </div>

      {/* Delete confirm modal */}
      {deleteConfirm && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.4)",
          display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000 }}>
          <div className="card fade-in" style={{ width:360, padding:"28px 32px" }}>
            <div style={{ fontSize:18, fontWeight:700, marginBottom:8 }}>确认删除</div>
            <div style={{ fontSize:14, color:"#7A7167", marginBottom:20 }}>

    </div>
  );
}

// ── KBReleasePipeline ─────────────────────────────────────────────────────────
function KBReleasePipeline() {
  const [phase, setPhase] = React.useState("idle"); // idle | running | done | error
  const [step, setStep]   = React.useState(0);
  const [log, setLog]     = React.useState([]);
  const [version, setVersion] = React.useState("v0.0.3");
  const [msg, setMsg]     = React.useState("feat: 新增应用题集×2，更新错题模板");
  const timerRef = React.useRef();

  const draftDocs = MOCK_DOCS.filter(d => d.status === "draft");

  const LOG_LINES = [
    ["[git]", "Staging 3 modified files…", "#7A7167"],
    ["[git]", "Changes staged ✓", "#16A34A"],
    ["[git]", `Committing: "${msg}"`, "#7A7167"],
    ["[git]", "Commit abc123f ✓", "#16A34A"],
    ["[git]", "Pushing to origin/main…", "#7A7167"],
    ["[git]", "Branch pushed ✓", "#16A34A"],
    ["[gh]",  "Pull Request #42 created", "#1865F2"],
    ["[gh]",  "Auto-merge check passed ✓", "#16A34A"],
    ["[vec]", "Loading BGE-M3 model…", "#7A7167"],
    ["[vec]", "Encoding 3 new documents…", "#7A7167"],
    ["[vec]", "Upserted 3 vectors into ChromaDB ✓", "#16A34A"],
    ["[rel]", `Creating GitHub Release ${version}…`, "#7A7167"],
    ["[rel]", `Release ${version} published ✓ 🎉`, "#16A34A"],
  ];

  function startRelease() {
    setPhase("running"); setStep(0); setLog([]);
    let s = 0;
    let logIdx = 0;
    timerRef.current = setInterval(() => {
      // Advance pipeline step
      s++;
      setStep(s);
      // Add 2 log lines per step
      setLog(l => [...l,
        LOG_LINES[logIdx] || LOG_LINES[LOG_LINES.length-1],
        LOG_LINES[logIdx+1] || LOG_LINES[LOG_LINES.length-1],
      ]);
      logIdx += 2;
      if (s >= PIPELINE_RELEASE.length) {
        clearInterval(timerRef.current);
        setPhase("done");
      }
    }, 900);
  }

  function reset() {
    clearInterval(timerRef.current);
    setPhase("idle"); setStep(0); setLog([]);
  }

  return (
    <div className="fade-in">
      <div className="page-title">知识库发布</div>
      <div className="page-sub">发起 KB Release — LangGraph 任务链自动执行</div>

      {/* Pre-release summary */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:20 }}>
        <div className="card">
          <div style={{ fontSize:14, fontWeight:700, marginBottom:12 }}>待发布内容</div>
          {draftDocs.length === 0 ? (
            <div style={{ fontSize:14, color:"#9E9589" }}>暂无 draft 文档</div>
          ) : draftDocs.map(d => (
            <div key={d.id} style={{ display:"flex", alignItems:"center", gap:8,
              padding:"6px 0", borderBottom:"1px solid #EDE8DF", fontSize:13 }}>
              <span className={`tag tag-${d.type}`}>{d.type}</span>
              <span style={{ flex:1, color:"#1A1A1A", fontWeight:500 }}>{d.title}</span>
              <code style={{ fontSize:11, color:"#9E9589" }}>{d.id.split(".")[0]}.{d.id.split(".")[3]}</code>
            </div>
          ))}
        </div>
        <div className="card">
          <div style={{ fontSize:14, fontWeight:700, marginBottom:12 }}>发布配置</div>
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
              <label style={{ fontSize:13, fontWeight:600, color:"#5A5248" }}>目标版本号</label>
              <input value={version} onChange={e => setVersion(e.target.value)}
                disabled={phase !== "idle"}
                style={{ height:36, borderRadius:8, border:"1.5px solid #DDD8CE",
                  padding:"0 12px", fontSize:14, fontFamily:"inherit" }} />
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
              <label style={{ fontSize:13, fontWeight:600, color:"#5A5248" }}>提交信息</label>
              <input value={msg} onChange={e => setMsg(e.target.value)}
                disabled={phase !== "idle"}
                style={{ height:36, borderRadius:8, border:"1.5px solid #DDD8CE",
                  padding:"0 12px", fontSize:14, fontFamily:"inherit" }} />
            </div>
            {phase === "idle" && (
              <button className="btn-primary" style={{ height:42 }} onClick={startRelease}>
                🚀 发起 KB Release
              </button>
            )}
            {phase === "done" && (
              <div style={{ display:"flex", gap:8 }}>
                <div style={{ flex:1, background:"#F0FDF4", border:"1.5px solid #86EFAC",
                  borderRadius:8, padding:"10px 14px", fontSize:14, fontWeight:600, color:"#16A34A" }}>
                  ✓ {version} 发布成功！
                </div>
                <button className="btn-ghost" onClick={reset}>重置</button>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Pipeline animation */}
      {phase !== "idle" && (
        <div style={{ marginBottom:16 }}>
          <AgentPipeline steps={PIPELINE_RELEASE} currentStep={step} />
        </div>
      )}

      {/* Log output */}
      {log.length > 0 && (
        <div className="card" style={{ padding:0, overflow:"hidden" }}>
          <div style={{ padding:"10px 16px", background:"#F8F5F0", borderBottom:"1px solid #EDE8DF",
            fontSize:13, fontWeight:700, color:"#5A5248" }}>任务日志</div>
          <div style={{ background:"#1A1A2E", padding:"16px 18px", maxHeight:240, overflowY:"auto" }}>
            {log.map((line, i) => (
              <div key={i} style={{ fontSize:13, lineHeight:1.8, fontFamily:"monospace" }}>
                <span style={{ color:"#4A90D9", marginRight:8 }}>{line[0]}</span>
                <span style={{ color:line[2] }}>{line[1]}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── KBVersionControl ──────────────────────────────────────────────────────────
function KBVersionControl() {
  const [versions, setVersions] = React.useState(MOCK_VERSIONS);
  const [promoting, setPromoting] = React.useState(null);
  const [rolling, setRolling]   = React.useState(null);

  function promote(v) {
    setPromoting(v);
    setTimeout(() => {
      setVersions(vers => vers.map(ver => ({
        ...ver,
        status: ver.version === v ? "active" : ver.status === "active" ? "deprecated" : ver.status,
      })));
      setPromoting(null);
    }, 1200);
  }

  function rollback(v) {
    setRolling(v);
    setTimeout(() => {
      setVersions(vers => vers.map(ver => ({
        ...ver,
        status: ver.version === v ? "active" : ver.version === "v0.0.2" ? "active" : ver.status,
      })));
      setRolling(null);
    }, 1200);
  }

  return (
    <div className="fade-in">
      <div className="page-title">版本控制</div>
      <div className="page-sub">查看所有 KB 版本 · 回滚或切换版本</div>

      <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
        {versions.map(v => (
          <div key={v.version} className="card" style={{
            borderColor: v.status === "active" ? "#86EFAC" : v.status === "draft" ? "#93C5FD" : "#EDE8DF",
            background: v.status === "active" ? "#F0FDF4" : v.status === "draft" ? "#F0F5FF" : "#fff",
          }}>
            <div style={{ display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
              {/* Version badge */}
              <div style={{ display:"flex", flexDirection:"column", gap:4, minWidth:80 }}>
                <code style={{ fontSize:18, fontWeight:800,
                  color: v.status==="active"?"#16A34A":v.status==="draft"?"#1865F2":"#9E9589" }}>
                  {v.version}
                </code>
                <span className={`tag tag-${v.status}`}>{v.status}</span>
              </div>

              {/* Meta */}
              <div style={{ flex:1, display:"flex", flexDirection:"column", gap:4 }}>
                <div style={{ fontSize:14, fontWeight:600, color:"#1A1A1A" }}>{v.changes}</div>
                <div style={{ fontSize:12, color:"#7A7167" }}>
                  {v.author} · {v.date} · {v.docs} 份文档
                </div>
                {v.units.length > 0 && (
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:2 }}>
                    {v.units.map(u => (
                      <span key={u} style={{ fontSize:12, background:"#EEF3FF", color:"#1865F2",
                        borderRadius:6, padding:"1px 8px", fontWeight:600 }}>{u}</span>
                    ))}
                  </div>
                )}
              </div>

              {/* Actions */}
              <div style={{ display:"flex", gap:8 }}>
                {v.status === "draft" && (
                  <button className="btn-primary"
                    style={{ opacity: promoting===v.version ? 0.7 : 1 }}
                    onClick={() => promote(v.version)}>
                    {promoting===v.version ? "发布中…" : "发布此版本"}
                  </button>
                )}
                {v.status === "active" && v.version !== "v0.0.2" && (
                  <div style={{ fontSize:13, color:"#16A34A", fontWeight:600,
                    background:"#F0FDF4", borderRadius:8, padding:"6px 14px" }}>
                    当前生产版本
                  </div>
                )}
                {v.status === "active" && v.version !== versions.find(x=>x.status==="active")?.version && (
                  <button className="btn-ghost"
                    onClick={() => rollback(v.version)}
                    style={{ opacity: rolling===v.version ? 0.7 : 1 }}>
                    {rolling===v.version ? "回滚中…" : "回滚至此版本"}
                  </button>
                )}
                {v.status === "deprecated" && (
                  <button className="btn-ghost" onClick={() => rollback(v.version)}
                    style={{ opacity: rolling===v.version ? 0.7 : 1 }}>
                    {rolling===v.version ? "恢复中…" : "恢复此版本"}
                  </button>
                )}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── KBVersionMap ──────────────────────────────────────────────────────────────
function KBVersionMap() {
  const [unitVersions, setUnitVersions] = React.useState(MOCK_UNIT_VERSIONS);
  const [editing, setEditing] = React.useState(null);
  const availableVersions = MOCK_VERSIONS.filter(v => v.status !== "deprecated").map(v => v.version);

  function updateVersion(unit, version) {
    setUnitVersions(uvs => uvs.map(u => u.unit === unit ? {...u, version, lastSync:"2026-05-03"} : u));
    setEditing(null);
  }

  const versionColors = {
    "v0.0.3": { bg:"#F0F5FF", border:"#93C5FD", text:"#1865F2" },
    "v0.0.2": { bg:"#F0FDF4", border:"#86EFAC", text:"#16A34A" },
    "v0.0.1": { bg:"#F5F3EF", border:"#DDD8CE", text:"#7A7167" },
  };

  return (
    <div className="fade-in">
      <div className="page-title">单元版本映射</div>
      <div className="page-sub">四年级下册 · 各单元当前使用的 KB 版本</div>

      {/* Version legend */}
      <div style={{ display:"flex", gap:8, marginBottom:16, flexWrap:"wrap" }}>
        {Object.entries(versionColors).map(([v, c]) => (
          <div key={v} style={{ display:"flex", alignItems:"center", gap:6,
            background:c.bg, border:`1.5px solid ${c.border}`, borderRadius:8, padding:"5px 12px" }}>
            <div style={{ width:8, height:8, borderRadius:"50%", background:c.text }} />
            <code style={{ fontSize:13, fontWeight:700, color:c.text }}>{v}</code>
            <span style={{ fontSize:12, color:"#7A7167" }}>
              {v==="v0.0.3"?"草稿":v==="v0.0.2"?"最新稳定":"稳定"}
            </span>
          </div>
        ))}
      </div>

      {/* Grid */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(280px, 1fr))", gap:12 }}>
        {unitVersions.map(u => {
          const vc = versionColors[u.version] || versionColors["v0.0.1"];
          const isEditing = editing === u.unit;
          return (
            <div key={u.unit} className="card" style={{
              borderColor: vc.border, background: vc.bg,
            }}>
              <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:10 }}>
                <div>
                  <div style={{ fontSize:15, fontWeight:700, color:"#1A1A1A", marginBottom:2 }}>{u.name}</div>
                  <div style={{ fontSize:12, color:"#7A7167" }}>G4T2 · {u.unit} · {u.docs} 份文档</div>
                </div>
                <button className="btn-ghost" style={{ fontSize:12, height:28, padding:"0 10px", flexShrink:0 }}
                  onClick={() => setEditing(isEditing ? null : u.unit)}>
                  {isEditing ? "取消" : "切换"}
                </button>
              </div>

              {!isEditing ? (
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <code style={{ fontSize:16, fontWeight:800, color:vc.text }}>{u.version}</code>
                  <span style={{ fontSize:12, color:"#9E9589" }}>同步于 {u.lastSync}</span>
                </div>
              ) : (
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  <div style={{ fontSize:13, fontWeight:600, color:"#5A5248" }}>选择版本</div>
                  <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                    {availableVersions.map(v => {
                      const c = versionColors[v] || {};
                      return (
                        <button key={v} onClick={() => updateVersion(u.unit, v)}
                          style={{ padding:"6px 14px", borderRadius:8, cursor:"pointer",
                            border:`1.5px solid ${c.border}`, background:c.bg, fontFamily:"inherit",
                            fontSize:13, fontWeight:700, color:c.text,
                            boxShadow: u.version===v ? "0 0 0 2px "+c.text : "none" }}>
                          {v}
                        </button>
                      );
                    })}
                  </div>
                  <div style={{ fontSize:12, color:"#7A7167" }}>
                    切换后立即生效，该单元的检索将使用新版本文档
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Summary table */}
      <div className="card" style={{ marginTop:20, padding:0, overflow:"hidden" }}>
        <div style={{ padding:"10px 16px", background:"#F8F5F0", borderBottom:"1px solid #EDE8DF",
          fontSize:13, fontWeight:700, color:"#5A5248" }}>版本分布总览</div>
        <div style={{ padding:"16px 20px", display:"flex", gap:20, flexWrap:"wrap" }}>
          {Object.entries(
            unitVersions.reduce((acc, u) => { acc[u.version] = (acc[u.version]||0)+1; return acc; }, {})
          ).map(([v, count]) => {
            const c = versionColors[v] || {};
            return (
              <div key={v} style={{ display:"flex", alignItems:"center", gap:10 }}>
                <code style={{ fontSize:15, fontWeight:800, color:c.text }}>{v}</code>
                <div style={{ fontSize:13, color:"#7A7167" }}>使用中：{count} 个单元</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
const NAV_ITEMS = [
  { section:"学生管理", items:[
    { id:"students", icon:"👥", label:"学生成长概览" },
  ]},
  { section:"知识库", items:[
    { id:"docs",     icon:"📁", label:"文档库管理" },
    { id:"release",  icon:"🚀", label:"KB 发布" },
    { id:"versions", icon:"🏷",  label:"版本控制" },
    { id:"vmap",     icon:"🗺",  label:"单元版本映射" },
  ]},
];

function AdminPanel() {
  const [page, setPage] = React.useState("students");
  const user = React.useMemo(() => {
    try { return JSON.parse(localStorage.getItem("mtt_user") || "{}"); } catch(e) { return {}; }
  }, []);

  function renderPage() {
    if (page === "students") return <StudentOverview />;
    if (page === "docs")     return <KBDocManager />;
    if (page === "release")  return <KBReleasePipeline />;
    if (page === "versions") return <KBVersionControl />;
    if (page === "vmap")     return <KBVersionMap />;
    return null;
  }

  return (
    <div id="shell">
      {/* Top bar */}
      <div id="topbar">
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ width:32, height:32, borderRadius:8, background:"#1865F2",
            display:"flex", alignItems:"center", justifyContent:"center",
            fontSize:16, fontWeight:800, color:"#fff" }}>数</div>
          <span style={{ fontSize:15, fontWeight:700, color:"#1A1A1A" }}>数学助手</span>
          <span style={{ fontSize:13, color:"#9E9589", background:"#F5F3EF",
            borderRadius:6, padding:"2px 10px", marginLeft:4 }}>管理后台</span>
        </div>
        <div style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:12 }}>
          <a href="Math Tutor.html"
            style={{ fontSize:13, color:"#1865F2", fontWeight:600, textDecoration:"none",
              background:"#EEF3FF", borderRadius:8, padding:"5px 12px" }}>
            ← 学习界面
          </a>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <span style={{ fontSize:18 }}>{user.avatar || "👩‍🏫"}</span>
            <div>
              <div style={{ fontSize:13, fontWeight:700, lineHeight:1.2 }}>{user.name || "管理员"}</div>
              <div style={{ fontSize:11, color:"#9E9589" }}>{user.title || "admin"}</div>
            </div>
          </div>
          <a href="Login.html"
            style={{ fontSize:13, color:"#7A7167", textDecoration:"none",
              border:"1.5px solid #DDD8CE", borderRadius:8, padding:"5px 12px" }}>
            退出
          </a>
        </div>
      </div>

      <div id="body">
        {/* Side nav */}
        <div id="sidenav">
          {NAV_ITEMS.map(section => (
            <React.Fragment key={section.section}>
              <div className="nav-section">{section.section}</div>
              {section.items.map(item => (
                <button key={item.id}
                  className={`nav-item${page === item.id ? " active" : ""}`}
                  onClick={() => setPage(item.id)}>
                  <span style={{ fontSize:16 }}>{item.icon}</span>
                  <span>{item.label}</span>
                </button>
              ))}
            </React.Fragment>
          ))}
        </div>

        {/* Content */}
        <div id="content">{renderPage()}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AdminPanel />);
</script>
</body>
</html>
