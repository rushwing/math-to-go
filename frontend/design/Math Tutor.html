<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FFF9F0;
    --blue: #1865F2;
    --blue-light: #EEF3FF;
    --surface: #FFFFFF;
    --border: #EDE8DF;
    --text: #1A1A1A;
    --text-secondary: #7A7167;
    --text-muted: #9E9589;
  }

  html, body { height: 100%; font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; }
  #root { height: 100%; display: flex; flex-direction: column; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #DDD8CE; border-radius: 3px; }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.85)} }
  @keyframes shimmer { 0%{background:#EDE8DF} 50%{background:#F5F3EF} 100%{background:#EDE8DF} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  @keyframes ripple { 0%{transform:scale(.8);opacity:.8} 100%{transform:scale(2.2);opacity:0} }
  @keyframes thinkDot { 0%,80%,100%{transform:scale(.6);opacity:.4} 40%{transform:scale(1.1);opacity:1} }

  .fade-in { animation: fadeIn .25s ease both; }

  @media print {
    body { background: #fff !important; }
    #top-nav, #sidebar, .no-print { display: none !important; }
    #main-content { padding: 0 !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }

  #app-shell { display:flex; flex-direction:column; height:100%; overflow:hidden; }
  #top-nav { flex-shrink:0; z-index:100; position:relative; }
  #body { display:flex; flex:1; overflow:hidden; }

  #sidebar {
    width: 280px; flex-shrink:0;
    background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 20px 16px 24px;
    display: flex; flex-direction: column; gap: 20px;
  }

  #main-content { flex:1; overflow-y:auto; padding:24px 32px; display:flex; flex-direction:column; gap:20px; }

  .section-title { font-size:12px; font-weight:700; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }

  .output-placeholder { display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; min-height:320px; }
  .output-placeholder-icon { font-size:48px; opacity:.35; }
  .output-placeholder-text { font-size:16px; color:var(--text-muted); text-align:center;
    max-width:280px; line-height:1.6; }

  .progress-bar-wrap { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .progress-bar-fill { height:100%; background:var(--blue); border-radius:2px; transition:width .4s ease; }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    #sidebar { display:none; }
    #mobile-bottom { display:flex !important; }
    #main-content { padding:16px 12px 80px; }
  }
  #mobile-bottom { display:none; position:fixed; bottom:0; left:0; right:0;
    background:var(--surface); border-top:1px solid var(--border);
    padding:8px 12px; gap:6px; z-index:200; }
  .mobile-tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px; border-radius:8px; border:none; background:none; cursor:pointer;
    font-family:inherit; font-size:11px; color:var(--text-muted); min-height:52px; }
  .mobile-tab.active { background:var(--blue-light); color:var(--blue); }
  .mobile-tab-icon { font-size:20px; }

  textarea:focus { border-color: var(--blue) !important; outline: none; }

  /* Account menu hover */
  .ua-menu-item:hover { background: #F5F3EF !important; }

  /* ThreeColorNotes print */
  .three-color-notes code { font-family: 'Courier New', monospace; }
</style>

  const streamRef  = React.useRef(null);
  const pipeRef    = React.useRef(null);
  const cotRef     = React.useRef(null);
  const gradeRef   = React.useRef(null);

  function clearTimers() {
    [streamRef, pipeRef, cotRef, gradeRef].forEach(r => { if (r.current) clearInterval(r.current); });
  }

  // Restore answers from localStorage
  React.useEffect(() => {
    try {
      const saved = localStorage.getItem("mtt_answers");
      if (saved) setAnswers(JSON.parse(saved));
    } catch(e) {}
  }, []);

  function handleFileSelect(f) {
    setUploadWarning(f.size > 5*1024*1024
      ? `图片 ${(f.size/1024/1024).toFixed(1)} MB，超过 5 MB，建议压缩后重试。` : "");
    setUploadFile(f);
  }

  function handleStart() {
    clearTimers();
    setGradingResults(null);
    setAnswers({});
    setGradedCount(0);
    setReviewContent("");

    if (activeAction === "review") {
      setScreen("generating");
      setPipelineKey("review");
      setPipelineStep(0);
      setCotThoughts(""); setCotDone(false);
      setReviewStatus("streaming");
      runPipeline("review", () => runReviewStream());
    } else if (activeAction === "generate") {
      setScreen("generating");
      setPipelineKey("generate");
      setPipelineStep(0);
      setCotThoughts(""); setCotDone(false);
      runPipeline("generate", () => {
        setProblems(MOCK_PROBLEMS);
        setScreen("problem_preview");
      });
    } else if (activeAction === "drill") {
      setScreen("generating");
      setPipelineKey("drill");
      setPipelineStep(0);
      setCotThoughts(""); setCotDone(false);
      runPipeline("drill", () => {
        setProblems(MOCK_DRILL_PROBLEMS);
        setScreen("problem_preview");
      });
    } else if (activeAction === "grade") {
      // Phase 1: OCR
      setScreen("ocr_running");
      setPipelineKey("grade_ocr");
      setPipelineStep(0);
      setCotThoughts(""); setCotDone(false);
      runPipeline("grade_ocr", () => {
        setOcrResults(MOCK_OCR);
        setScreen("ocr_confirm");
      });
    }
  }

  function runPipeline(key, onDone) {
    const steps = PIPELINE[key] || [];
    const cot = COT[key] || "";
    let idx = 0;
    setPipelineStep(0);

    pipeRef.current = setInterval(() => {
      idx++;
      setPipelineStep(idx);
      if (idx === 1) runCoT(cot);
      if (idx >= steps.length) {
        clearInterval(pipeRef.current);
        setTimeout(onDone, 400);
      }
    }, 650);
  }

  function runCoT(text) {
    let i = 0;
    const chars = text.split("");
    setCotThoughts(""); setCotDone(false);
    cotRef.current = setInterval(() => {
      i += 4;
      setCotThoughts(chars.slice(0, i).join(""));
      if (i >= chars.length) { clearInterval(cotRef.current); setCotDone(true); }
    }, 16);
  }

  function runReviewStream() {
    let i = 0, content = "";
    streamRef.current = setInterval(() => {
      if (i >= REVIEW_CHUNKS.length) {
        clearInterval(streamRef.current);
        setReviewStatus("complete");
        setScreen("review_result");
        return;
      }
      content += REVIEW_CHUNKS[i];
      setReviewContent(content);
      i++;
    }, 55);
  }

  function handleStartAnswering() {
    setAnswers({});
    setGradingResults(null);
    setScreen("answering");
  }

  function handleAnswerChange(idx, val) {
    setAnswers(a => {
      const next = { ...a, [idx]: val };
      try { localStorage.setItem("mtt_answers", JSON.stringify(next)); } catch(e) {}
      return next;
    });
  }

  function handleSubmit() {
    // Build grading input from answers + problems
    clearTimers();
    setGradedCount(0);
    setScreen("grading");
    setPipelineKey("grade_mark");
    setPipelineStep(0);
    setCotThoughts(""); setCotDone(false);

    // Simulate grading pipeline
    runPipeline("grade_mark", () => {
      // Simulate per-problem grading animation
      let n = 0;
      gradeRef.current = setInterval(() => {
        n++;
        setGradedCount(n);
        if (n >= problems.length) {
          clearInterval(gradeRef.current);
          // Build mock results merging answers
          const results = problems.map((p, i) => {
            const studentAns = (answers[i] || "").trim();
            // Simple check: if answer contains the correct answer string
            const isCorrect = studentAns.includes(p.answer.replace("（", "").replace("）", ""));
            return {
              id: p.id,
              question: p.question,
              studentAnswer: studentAns || "（未作答）",
              correct: isCorrect,
              correctAnswer: p.answer,
              explanation: isCorrect ? "" : `正确答案是 ${p.answer}。解题过程：\n${p.solution}`,
              source: "kb_match",
            };
          });
          setGradingResults(results);
          setTimeout(() => setScreen("graded"), 600);
        }
      }, 500);
    });
  }

  function handleOcrConfirm() {
    // Start actual grading after OCR confirm
    clearTimers();
    setGradedCount(0);
    setScreen("grading");
    setPipelineKey("grade_mark");
    setPipelineStep(0);
    setCotThoughts(""); setCotDone(false);

    runPipeline("grade_mark", () => {
      let n = 0;
      gradeRef.current = setInterval(() => {
        n++;
        setGradedCount(n);
        if (n >= MOCK_OCR.length) {
          clearInterval(gradeRef.current);
          setGradingResults(MOCK_GRADE_RESULTS);
          // Map OCR problems for display
          setProblems(MOCK_OCR.map((o, i) => ({
            id: o.id, question: o.question,
            answer: MOCK_GRADE_RESULTS[i]?.correctAnswer || "",
            solution: "", difficulty: "medium", subtopic: "方程",
          })));
          setTimeout(() => setScreen("graded"), 600);
        }
      }, 500);
    });
  }

  function handleReset() {
    clearTimers();
    setScreen("idle");
    setReviewContent(""); setReviewStatus("idle");
    setProblems([]); setGradingResults(null);
    setAnswers({}); setGradedCount(0);
    setOcrResults([]);
    setPipelineStep(0); setCotThoughts(""); setCotDone(false);
    setUploadFile(null); setUploadWarning("");
  }

  // ── Render main content ─────────────────────────────────────────────────────
  function renderMain() {
    // Idle placeholder
    if (screen === "idle") {
      const meta = {
        review:   { icon:"📚", text:"选择单元后点击「开始」，AI 将生成三色复习笔记" },
        generate: { icon:"📝", text:"设置参数后点击「开始」，AI 将生成练习题供你作答" },
        grade:    { icon:"📷", text:"上传作业图片后点击「开始」，AI 将识图并批改" },
        drill:    { icon:"💪", text:"点击「开始」，加载今日艾宾浩斯错题进行练习" },
      };
      const m = meta[activeAction] || meta.review;
      return (
        <div className="output-placeholder fade-in">
          <div className="output-placeholder-icon">{m.icon}</div>
          <div className="output-placeholder-text">{m.text}</div>
        </div>
      );
    }

    // Generating (review/generate/drill) — pipeline + CoT + skeleton
    if (screen === "generating") {
      return (
        <div className="fade-in" style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <AgentPipeline steps={PIPELINE[pipelineKey] || []} currentStep={pipelineStep} />
          <CoTStream thoughts={cotThoughts} isThinking={!cotDone} expanded={true} onToggle={() => {}} />
          {pipelineKey === "review" && reviewContent && (
            <div style={{ background:"#fff", borderRadius:12, border:"1.5px solid #EDE8DF", padding:"20px 24px" }}>
              <div dangerouslySetInnerHTML={{ __html: reviewContent }} style={{ fontSize:16, lineHeight:1.8 }} />
            </div>
          )}
          {pipelineKey === "review" && !reviewContent && (
            <div style={{ background:"#fff", borderRadius:12, border:"1.5px solid #EDE8DF", padding:"20px 24px" }}>
              <StreamingSkeleton />
            </div>
          )}
        </div>
      );
    }

    // Review result
    if (screen === "review_result") {
      return (
        <div className="fade-in" style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between",
            background:"#F0FDF4", borderRadius:10, border:"1.5px solid #86EFAC", padding:"10px 16px" }}>
            <span style={{ fontSize:14, color:"#16A34A", fontWeight:600 }}>✓ 三色笔记生成完成</span>
            <div style={{ display:"flex", gap:8 }}>
              <button style={btnStyle.secondary} onClick={() => window.print()}>🖨 打印</button>
              <button style={btnStyle.ghost} onClick={handleReset}>重新开始</button>
            </div>
          </div>
          <ThreeColorNotes unit="认识方程" />
        </div>
      );
    }

    // Problem preview (generate / drill)
    if (screen === "problem_preview") {
      return (
        <div className="fade-in">
          <ProblemSetPreview
            problems={problems}
            gradingResults={gradingResults}
            onStartAnswering={handleStartAnswering}
            mode={activeAction}
          />
        </div>
      );
    }

    // Answer session
    if (screen === "answering") {
      return (
        <div className="fade-in" style={{ height:"100%", minHeight:540 }}>
          <AnswerSession
            problems={problems}
            answers={answers}
            onAnswerChange={handleAnswerChange}
            onSubmit={handleSubmit}
            onBack={() => setScreen("problem_preview")}
          />
        </div>
      );
    }

    // OCR running
    if (screen === "ocr_running") {
      return (
        <div className="fade-in" style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <AgentPipeline steps={PIPELINE.grade_ocr} currentStep={pipelineStep} />
          <CoTStream thoughts={cotThoughts} isThinking={!cotDone} expanded={true} onToggle={() => {}} />
          <div style={{ background:"#fff", borderRadius:12, border:"1.5px solid #EDE8DF", padding:"20px 24px" }}>
            <StreamingSkeleton />
          </div>
        </div>
      );
    }

    // OCR confirm
    if (screen === "ocr_confirm") {
      return (
        <div className="fade-in">
          <GradeConfirmPreview
            ocrResults={ocrResults}
            onConfirm={handleOcrConfirm}
            onCancel={handleReset}
          />
        </div>
      );
    }

    // Grading in progress
    if (screen === "grading") {
      return (
        <div className="fade-in" style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <AgentPipeline steps={PIPELINE[pipelineKey] || []} currentStep={pipelineStep} />
          <CoTStream thoughts={cotThoughts} isThinking={!cotDone} expanded={false} onToggle={() => {}} />
          <GradingProgress
            problems={problems.length ? problems : MOCK_OCR.map((o,i) => ({ id:o.id, question:o.question }))}
            gradedCount={gradedCount}
            pipelineSteps={PIPELINE.grade_mark}
            currentPipelineStep={pipelineStep}
          />
        </div>
      );
    }

    // Graded results
    if (screen === "graded") {
      return (
        <div className="fade-in" style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between",
            background:"#F0FDF4", borderRadius:10, border:"1.5px solid #86EFAC", padding:"10px 16px" }}>
            <span style={{ fontSize:14, color:"#16A34A", fontWeight:600 }}>✓ 批改完成</span>
            <div style={{ display:"flex", gap:8 }}>
              <button style={btnStyle.secondary}
                onClick={() => setScreen("problem_preview")}>
                返回题目预览
              </button>
              <button style={btnStyle.ghost} onClick={handleReset}>重新开始</button>
            </div>
          </div>
          <GradingReportV2 results={gradingResults} problems={problems} />
          {/* Also show preview with results */}
          <ProblemSetPreview
            problems={problems}
            gradingResults={gradingResults}
            onStartAnswering={handleStartAnswering}
            mode={activeAction}
          />
        </div>
      );
    }

    return null;
  }

  const btnStyle = {
    primary: {
      padding:"8px 18px", height:38, background:"#1865F2", color:"#fff",
      border:"none", borderRadius:8, fontSize:14, fontWeight:600,
      cursor:"pointer", fontFamily:"inherit",
    },
    secondary: {
      padding:"8px 18px", height:38, background:"#fff", color:"#1865F2",
      border:"1.5px solid #1865F2", borderRadius:8, fontSize:14, fontWeight:600,
      cursor:"pointer", fontFamily:"inherit",
    },
    ghost: {
      padding:"8px 18px", height:38, background:"#fff", color:"#7A7167",
      border:"1.5px solid #DDD8CE", borderRadius:8, fontSize:14, fontWeight:500,
      cursor:"pointer", fontFamily:"inherit",
    },
  };

  // ── Sidebar ─────────────────────────────────────────────────────────────────
  const sidebar = (
    <>
      <div>
        <div className="section-title">选择操作</div>
        <ActionPanel
          activeAction={activeAction}
          onSelect={setActiveAction}
          selection={selection}
          subtopic={subtopic}
          onSubtopicChange={setSubtopic}
          count={count}
          onCountChange={setCount}
          strict={strict}
          onStrictChange={setStrict}
        />
      </div>
      {activeAction === "grade" && (
        <div>
          <div className="section-title">上传作业</div>
          <GradePanel onFileSelect={handleFileSelect} file={uploadFile} warning={uploadWarning} />
        </div>
      )}
      <div>
        <FreeQueryInput expanded={freeExpanded} onToggle={() => setFreeExpanded(v => !v)} />
      </div>
    </>
  );

  return (
    <div id="app-shell" style={{ fontSize: tweaks.fontSize, "--blue": tweaks.accentColor }}>
      <div id="top-nav">
        <CurriculumNav
          selection={selection}
          onChange={sel => { setSelection(sel); handleReset(); }}
          onStart={handleStart}
          disabled={screen === "generating" || screen === "ocr_running" || screen === "grading"}
        />
      </div>
      <div id="body">
        {tweaks.showSidebar && <div id="sidebar">{sidebar}</div>}
        <div id="main-content">{renderMain()}</div>
      </div>

      {/* Mobile bottom tabs */}
      <div id="mobile-bottom">
        {[
          { id:"review",   icon:"📚", label:"复习" },
          { id:"generate", icon:"📝", label:"练习" },
          { id:"grade",    icon:"📷", label:"批改" },
          { id:"drill",    icon:"💪", label:"夯实" },
        ].map(t => (
          <button key={t.id}
            className={`mobile-tab${activeAction === t.id ? " active" : ""}`}
            onClick={() => { setActiveAction(t.id); handleReset(); }}
          >
            <span className="mobile-tab-icon">{t.icon}</span>
            <span>{t.label}</span>
          </button>
        ))}
      </div>

      {/* Tweaks */}
      <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
        <TweakSection title="外观">
          <TweakColor  id="accentColor"  label="主题色"   value={tweaks.accentColor}  onChange={v => setTweak("accentColor", v)} />
          <TweakSlider id="fontSize"     label="字号"     value={tweaks.fontSize}     onChange={v => setTweak("fontSize", v)}     min={14} max={20} step={1} />
          <TweakSlider id="cardRadius"   label="圆角"     value={tweaks.cardRadius}   onChange={v => setTweak("cardRadius", v)}   min={4}  max={20} step={2} />
          <TweakToggle id="showSidebar"  label="侧边栏"   value={tweaks.showSidebar}  onChange={v => setTweak("showSidebar", v)} />
        </TweakSection>
        <TweakSection title="快速演示">
          <TweakButton label="📚 复习笔记" onClick={() => { setActiveAction("review");   handleStart(); }} />
          <TweakButton label="📝 练习题"   onClick={() => { setActiveAction("generate"); handleStart(); }} />
          <TweakButton label="📷 作业批改" onClick={() => { setActiveAction("grade");    handleStart(); }} />
          <TweakButton label="💪 错题夯实" onClick={() => { setActiveAction("drill");    handleStart(); }} />
          <TweakButton label="重置"        onClick={handleReset} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
